<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Registro</title>
  <link rel="stylesheet" href="registro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo-wrapper"><div class="logo-circle">
      <img src="../multimedia/logo-frontera-beisbolera.png" alt="Logo" class="logo-img" onerror="this.style.display='none';">
    </div></div>
    <nav class="nav-buttons">
      <a href="../home/index.html" class="btn btn-secondary">Página Principal</a>
      <a href="../inicio_sesion/inicio_sesion.html" class="btn btn-secondary">Iniciar Sesión</a>
    </nav>
  </header>
  <main class="page-container">
    <section class="central-banner">
      <div class="register-card">
        <header class="card-header">
          <h1 class="register-title">Crear Cuenta</h1>
          <p class="register-subtitle">Únete a la comunidad de la Frontera Beisbolera</p>
        </header>

        <form id="registro-form" class="register-form" autocomplete="on">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="80" placeholder="Ej. Juan" required>
          </div>
          <div class="form-group">
            <label for="apellido_paterno">Apellido paterno</label>
            <input type="text" id="apellido_paterno" name="apellido_paterno" maxlength="80" placeholder="Ej. Pérez" required>
          </div>
          <div class="form-group">
            <label for="apellido_materno">Apellido materno</label>
            <input type="text" id="apellido_materno" name="apellido_materno" maxlength="80" placeholder="Ej. López" required>
          </div>
          <div class="form-group">
            <label for="nombre_usuario">Nombre de usuario</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" minlength="3" maxlength="40"
                   pattern="[A-Za-z0-9_.-]{3,40}" title="3 a 40 caracteres: letras, números, punto, guion o guion bajo"
                   placeholder="Ej. beisbolista99" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="72"
                   placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" minlength="8" maxlength="72"
                   placeholder="Repite tu contraseña" autocomplete="new-password" required>
          </div>
          <div class="form-terms">
            <label class="checkbox-label">
              <input type="checkbox" id="terms" required>
              <span>Acepto los términos de servicio y la política de privacidad</span>
            </label>
          </div>
          <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button type="submit" class="btn-card btn-confirm">Registrarse</button>
            <button type="button" class="btn-card btn-cancel" onclick="window.history.back();">Cancelar</button>
          </div>
        </form>
        <footer class="card-footer">
          <p class="login-redirect">¿Ya tienes cuenta? <a href="../inicio_sesion/inicio_sesion.html">Inicia sesión</a></p>
        </footer>
      </div>
    </section>
  </main>
  <footer class="footer-bar"></footer>
  <script src="auth.js"></script>
  <script src="../session-ui.js"></script>
</body>
</html>
