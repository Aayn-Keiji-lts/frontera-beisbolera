<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minijuego - Base</title>
  <link rel="stylesheet" href="minijuego.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../Components/navbar.css">
</head>
<body>

  <header class="navbar">
    <nav class="nav-links">

    </nav>
  </header>

  <main class="game-container">
    
    <div id="game-status-panel">
      <div id="strikes-counter">Strikes: 0 / 3</div>
      <div id="points-counter">Puntos: 0</div>
    </div>

    <div id="game-overlay">
      <h2 id="overlay-title">Frontera Beisbolera</h2>
      <p id="overlay-message">¡Presiona batear cuando la línea esté en verde para un Home Run!</p>
      <button type="button" id="btn-iniciar-juego">Iniciar Juego</button>
    </div>

    <section class="stadium-stage">
      
      <!-- Fondo desenfocado del estadio -->
      <div class="stadium-bg"></div>
      
      <!-- Contenedor del bate y la pelota para animarlos -->
      <div class="game-assets" id="animacion-bateo">
        <img src="../../Assets/Pelota.png" alt="Pelota" class="ball-img">
        <img src="../../Assets/Bate.png" alt="Bate" class="bat-img">
      </div>

      <div id="action-message"></div>

      <div class="precision-bar" id="barra-precision">
        <div class="color-zone red top-red"></div>
        <div class="color-zone yellow top-yellow"></div>
        <div class="color-zone green center-green"></div>
        <div class="color-zone yellow bottom-yellow"></div>
        <div class="color-zone red bottom-red"></div>
        <div class="target-line" id="linea-indicadora"></div>
      </div>

      <button type="button" class="btn-batear btn-desktop btn-accion">Batear</button>
    </section>

    <div class="mobile-bottom-area">
      <button type="button" class="btn-batear btn-mobile btn-accion">Batear</button>
    </div>
  </main>

  <footer class="footer-bar"></footer>

  <!-- Aquí enlazamos tu nuevo archivo JavaScript -->
   <script>
    fetch('../../Components/NavBar.html')
  .then(response => response.text())
  .then(data => {
    document.querySelector('header.navbar').innerHTML = data;
    
    // Lógica del menú hamburguesa
    const btnMenu = document.getElementById('mobile-menu-btn');
    const navLinks = document.getElementById('nav-links');
    if(btnMenu && navLinks) {
        btnMenu.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        });
    }
  });
  </script>
  <script src="minijuego.js"></script>
  
</body>
</html>
