<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Iniciar Sesión</title>
  <link rel="stylesheet" href="inicio_sesion.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
  <header class="navbar" id="navbar-container"></header>

  <main class="page-container">
    <section class="central-banner">
      <div class="login-card">
        <header class="card-header">
          <h1 class="login-title">Iniciar Sesión</h1>
          <p class="login-subtitle">Ingresa tus credenciales para acceder a la wiki</p>
        </header>
        <form id="login-form" class="login-form" autocomplete="on">
          <div class="form-group">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="nombre_usuario" placeholder="Ej. beisbolista99" maxlength="40" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button type="submit" class="btn-card btn-confirm">Iniciar Sesión</button>
            <button type="button" class="btn-card btn-cancel" onclick="window.history.back();">Cancelar</button>
          </div>
        </form>
        <footer class="card-footer">
          <p>¿No tienes cuenta? <a href="../registro/registro.html">Regístrate aquí</a></p>
        </footer>
      </div>
    </section>
  </main>

  <script src="../../components/navbar.js"></script>
  <footer class="footer-bar"></footer>
  <script src="auth.js"></script>
  <script src="../session-ui.js"></script>
</body>
</html>
