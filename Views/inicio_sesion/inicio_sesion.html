<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Iniciar Sesión</title>
  <link rel="stylesheet" href="inicio_sesion.css">
  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="logo-wrapper">
      <div class="logo-circle">
        <img src="../multimedia/logo-frontera-beisbolera.png" alt="Logo" class="logo-img" onerror="this.style.display='none';">
      </div>
    </div>

    <nav class="nav-buttons">
      <a href="..\home\index.html" class="btn btn-secondary">Pagina Principal</a>
      <a href="..\registro\registro.html" class="btn btn-secondary">Registro</a>
    </nav>
  </header>

  <main class="page-container">
    <section class="central-banner">
      <div class="login-card">
        <header class="card-header">
          <h1 class="login-title">Iniciar Sesión</h1>
          <p class="login-subtitle">Ingresa tus credenciales para acceder a la wiki</p>
        </header>

        <form class="login-form" autocomplete="on">
          <div class="form-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ej. beisbolista99" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-card btn-confirm">Iniciar Sesión</button>
            <button type="button" class="btn-card btn-cancel" onclick="window.history.back();">Cancelar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Barra inferior decorativa -->
  <footer class="footer-bar"></footer>

</body>
</html>
