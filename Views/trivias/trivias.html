<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Trivias</title>
  <link rel="stylesheet" href="trivias.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Contenedor dinámico inyectado por navbar.js -->
  <header class="navbar" id="navbar-container"></header>

  <main class="page-container">
    <section class="central-banner">
      
      <div class="trivia-card" id="triviaCard">
        <header class="card-header">
          <div class="trivia-meta">
            <span class="badge-category">LMB Clásica</span>
            <span class="trivia-progress" id="questionProgress">Pregunta 1 de 5</span>
          </div>
          <h1 class="trivia-title" id="questionTitle">Cargando pregunta...</h1>
        </header>

        <form class="trivia-form" id="triviaForm">
          <div class="options-grid" id="optionsGrid"></div>

          <div class="form-actions">
            <button type="button" class="btn-card btn-nav" id="btnPrev">Anterior</button>
            <button type="button" class="btn-card btn-nav" id="btnNext">Siguiente</button>
            <button type="submit" class="btn-card btn-confirm" id="btnSubmit">Enviar respuestas</button>
            <button type="button" class="btn-card btn-cancel" onclick="window.location.href='../home/index.html';">Salir</button>
          </div>
        </form>
      </div>

      <div class="reward-modal" id="rewardModal">
        <div class="reward-card">
          <div class="reward-badge"><i class="fa-solid fa-award"></i> ¡Trivia Completada!</div>
          <h2 class="reward-title" id="rewardScoreText">Obtuviste 5/5 aciertos</h2>
          <p class="reward-subtitle" id="rewardSubtitle">¡Has ganado una nueva estampa para tu álbum!</p>
          
          <div class="stamp-wrapper" id="stampWrapper">
            <div class="stamp-frame">
              <img 
                src="" 
                alt="Estampa Desbloqueada" 
                id="stampImg" 
                class="stamp-img"
              >
              <div class="stamp-fallback" id="stampFallback" style="display: none;">
                <i class="fa-solid fa-baseball-bat-ball"></i>
              </div>
              <span class="stamp-label" id="stampName">Estampa LMB</span>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-card btn-confirm" id="btnPerfil" onclick="window.location.href='../perfil/perfil.html';">Ver en mi Perfil</button>
            <button type="button" class="btn-card btn-cancel" onclick="location.reload();">Jugar Otra Vez</button>
          </div>
        </div>
      </div>

    </section>
  </main>

  <footer class="footer-bar"></footer>

  <!-- Script modular para inyectar Navbar y controlar la sesión -->
  <script src="../../components/navbar.js"></script>
  <script src="trivias.js"></script>

</body>
</html>
