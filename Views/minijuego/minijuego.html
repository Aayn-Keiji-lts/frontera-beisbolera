<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minijuego - Base</title>
  <link rel="stylesheet" href="minijuego.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Contenedor dinámico inyectado por navbar.js -->
  <header class="navbar" id="navbar-container"></header>

  <main class="game-container">
    <section class="stadium-stage">
      
      <div class="precision-bar">
        <div class="color-zone red"></div>
        <div class="color-zone yellow"></div>
        <div class="color-zone green"></div>
        <div class="color-zone yellow"></div>
        <div class="color-zone red"></div>
        
        <div class="target-line"></div>
      </div>

      <button type="button" class="btn-batear btn-desktop">Batear</button>
    </section>

    <div class="mobile-bottom-area">
      <button type="button" class="btn-batear btn-mobile">Batear</button>
    </div>
  </main>

  <footer class="footer-bar"></footer>

  <!-- Script modular de Navbar y control de sesión -->
  <script src="../../components/navbar.js"></script>

</body>
</html>
