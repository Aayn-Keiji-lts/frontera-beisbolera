<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Sultanes de Monterrey</title>
  <link rel="stylesheet" href="equipo_individual.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Contenedor dinámico de la Navbar -->
  <header class="navbar" id="navbar-container"></header>

  <!-- Contenedor central -->
  <main class="page-container">
    <section class="central-banner">
      
      <div class="team-header">
        <div class="team-logo-box">
          <img 
            src="../multimedia/sultanes icon.png" 
            id="team-logo" 
            alt="Logo Sultanes" 
            class="team-logo-img" 
            onerror="this.style.display='none'; document.getElementById('team-fallback').style.display='block';"
          >
          <div class="team-logo-fallback" id="team-fallback">MT</div>
        </div>
        <h1 class="team-name" id="team-name">sultanes de mty</h1>
      </div>

      <p class="team-description" id="team-description">
        Cargando información del equipo...
      </p>

      <div class="section-block" id="estadisticas">
        <h2 class="section-heading">Estadísticas</h2>
        
        <div class="stats-table-card" id="stats-container">
          <!-- Se renderiza dinámicamente desde equipo_individual.js -->
        </div>
      </div>

      <div class="section-block" id="momentos">
        <h2 class="section-heading">mejores momentos</h2>
        
        <div class="moment-card">
          <h3 id="moment-title" class="moment-title">¡A tu casa!</h3>
          <div class="moment-image-wrapper">
            <img id="moment-img" src="../multimedia/bateador-momento.jpg" alt="Mejor momento Sultanes" class="moment-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="moment-fallback-img">Momento Épico</div>
          </div>
          <p id="moment-caption" class="moment-caption">
            Le pegó tan fuerte que casi se sale del estadio<br>
            <span class="moment-date">-29 de febrero del 2020</span>
          </p>
        </div>
      </div>

      <div class="section-block" id="videos">
        <h2 class="section-heading">videos</h2>
        
        <div class="videos-grid-container" id="videos-container">
          <!-- Se renderiza dinámicamente desde equipo_individual.js -->
        </div>
      </div>

    </section>
  </main>

  <footer class="footer-bar"></footer>

  <!-- Script modular de Navbar e inicio de sesión -->
  <script src="../../components/navbar.js"></script>
  <!-- Script de carga de datos dinámicos del equipo -->
  <script src="equipo_individual.js"></script>

</body>
</html>
