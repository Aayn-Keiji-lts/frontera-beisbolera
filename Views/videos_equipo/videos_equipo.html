<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Reproductor de Video</title>
  <link rel="stylesheet" href="videos_equipo.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Contenedor dinámico inyectado por navbar.js -->
  <header class="navbar" id="navbar-container"></header>

  <main class="page-container">
    <section class="central-banner">
      
      <h1 class="video-section-title" id="videoPageTitle">videos</h1>

      <div class="video-display-box" id="videoBox">
        <!-- Elemento de video que recibe la ruta desde videos_equipo.js -->
        <video id="mainVideoPlayer" controls playsinline>
          Tu navegador no soporta reproducción de video.
        </video>

        <!-- Botón de play opcional para triggers personalizados -->
        <button type="button" class="btn-play-trigger" id="btnPlay" aria-label="Reproducir video" style="display: none;">
          <i class="fa-solid fa-play"></i>
        </button>
      </div>

      <h2 class="filters-heading">Filtros</h2>

      <div class="filters-grid">
        <button type="button" class="btn-filter active" data-filter="none">Normal</button>
        <button type="button" class="btn-filter" data-filter="pixelado">pixelado</button>
        <button type="button" class="btn-filter" data-filter="desenfoque">desenfoque</button>
        <button type="button" class="btn-filter" data-filter="termica">Camara termica</button>
      </div>

    </section>
  </main>

  <footer class="footer-bar"></footer>

  <!-- Script modular para inyectar Navbar y controlar la sesión -->
  <script src="../../components/navbar.js"></script>
  <script src="videos_equipo.js"></script>

  <!-- Mapa SVG para filtro de cámara térmica -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <filter id="thermal-map">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0" />
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.0 0.1 0.6 1.0 1.0 1.0" />
        <feFuncG type="table" tableValues="0.0 0.0 0.0 0.2 0.8 1.0" />
        <feFuncB type="table" tableValues="0.3 0.8 0.2 0.0 0.0 1.0" />
      </feComponentTransfer>
    </filter>
  </svg>

</body>
</html>
