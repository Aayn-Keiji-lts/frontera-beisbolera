<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Frontera Beisbolera - Registro</title>
  <link rel="stylesheet" href="registro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="logo-wrapper">
      <div class="logo-circle">
        <img src="../multimedia/logo-frontera-beisbolera.png" alt="Logo" class="logo-img" onerror="this.style.display='none';">
      </div>
    </div>

    <nav class="nav-buttons">
      <a href="..\home\index.html" class="btn btn-secondary">Pagina Principal</a>
      <a href="..\inicio_sesion\inicio_sesion.html" class="btn btn-secondary">Iniciar Sesión</a>
    </nav>
  </header> 
  <main class="page-container">
    <section class="central-banner">
      <div class="register-card">
        <header class="card-header">
          <h1 class="register-title">Crear Cuenta</h1>
          <p class="register-subtitle">Únete a la comunidad de la Frontera Beisbolera</p>
        </header>

        <form class="register-form" autocomplete="on">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. beisbolista99" required>
          </div>

          <div class="form-group">
            <label for="apellido-paterno">Apellido Paterno</label>
            <input type="text" id="apellido-paterno" name="apellido-paterno" placeholder="Ej. García" required>
          </div>

          <div class="form-group">
            <label for="apellido-materno">Apellido Materno</label>
            <input type="text" id="apellido-materno" name="apellido-materno" placeholder="Ej. López" required>
          </div>

          <div class="form-group">
            <label for="nombre">Nombre de usuario</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. beisbolista99" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" minlength="8" required>
          </div>

          <div class="form-terms">
            <label class="checkbox-label">
              <input type="checkbox" required>
              <span>Acepto los términos de servicio y la política de privacidad</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-card btn-confirm">Registrarse</button>
            <button type="button" class="btn-card btn-cancel" onclick="window.history.back();">Cancelar</button>
          </div>
        </form>

        <footer class="card-footer">
          <p class="login-redirect">¿Ya tienes cuenta? <a href="..\inicio_sesion\inicio_sesion.html">Inicia sesión</a></p>
        </footer>
      </div>
    </section>
  </main>

  <footer class="footer-bar"></footer>

</body>
</html>
